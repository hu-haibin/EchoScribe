name: echoscribe

services:
  local-asr:
    build:
      context: ./local-asr
    image: echoscribe-local-asr:latest
    container_name: echoscribe-local-asr
    ports:
      - "127.0.0.1:8787:8787"
    gpus: all
    environment:
      QWEN3_ASR_MODEL: ${QWEN3_ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      QWEN3_ASR_FALLBACK_MODEL: ${QWEN3_ASR_FALLBACK_MODEL:-Qwen/Qwen3-ASR-0.6B}
      QWEN3_ALIGNER_MODEL: ${QWEN3_ALIGNER_MODEL:-Qwen/Qwen3-ForcedAligner-0.6B}
      QWEN3_USE_ALIGNER: ${QWEN3_USE_ALIGNER:-true}
      QWEN3_CHUNK_SECONDS: ${QWEN3_CHUNK_SECONDS:-600}
      QWEN3_MAX_BATCH_SIZE: ${QWEN3_MAX_BATCH_SIZE:-8}
      QWEN3_MAX_NEW_TOKENS: ${QWEN3_MAX_NEW_TOKENS:-2048}
      PYANNOTE_AUTH_TOKEN: ${PYANNOTE_AUTH_TOKEN:-}
      PYANNOTE_DIARIZATION_MODEL: ${PYANNOTE_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      PYANNOTE_DEVICE: ${PYANNOTE_DEVICE:-cuda}
      ECHOSCRIBE_SEGMENT_TARGET_SECONDS: ${ECHOSCRIBE_SEGMENT_TARGET_SECONDS:-4.5}
      ECHOSCRIBE_SEGMENT_MAX_SECONDS: ${ECHOSCRIBE_SEGMENT_MAX_SECONDS:-6.5}
      ECHOSCRIBE_SEGMENT_MAX_CHARS: ${ECHOSCRIBE_SEGMENT_MAX_CHARS:-28}
      ECHOSCRIBE_SEGMENT_SILENCE_SECONDS: ${ECHOSCRIBE_SEGMENT_SILENCE_SECONDS:-0.8}
      VOLCENGINE_SPEECH_API_KEY: ${VOLCENGINE_SPEECH_API_KEY:-}
      VOLCENGINE_SPEECH_APP_ID: ${VOLCENGINE_SPEECH_APP_ID:-}
      VOLCENGINE_SPEECH_ACCESS_TOKEN: ${VOLCENGINE_SPEECH_ACCESS_TOKEN:-}
      VOLCENGINE_SPEECH_RESOURCE_ID: ${VOLCENGINE_SPEECH_RESOURCE_ID:-volc.bigasr.auc_turbo}
      HF_HOME: /models/huggingface
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - ./.cache/local-asr:/models
    shm_size: "4gb"
    restart: unless-stopped
